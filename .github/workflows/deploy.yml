name: Deploy ST Executive → Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: rm -f package-lock.json && npm install

      - name: Injetar senha SMTP
        run: sed -i "s/__SMTP_PASSWORD__/${{ secrets.SMTP_PASSWORD }}/" public/smtp-config.php

      - name: Build do site
        run: npm run build

      - name: Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: 82.25.73.204
          username: u863651118.stexecutive.com.br
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          # O padrão de 30s vinha estourando no handshake com a Hostinger
          # ("Timeout (control socket)"), derrubando o deploy sem que nada
          # do código estivesse errado.
          timeout: 120000
          # sitemap.xml e sitemap-articles.xml são reescritos no servidor
          # por admin/sitemap-generator.php (PHP do Guia) toda vez que um
          # artigo é salvo, com uma versão mais rica (78 URLs × 3 idiomas +
          # hreflang, e lastmod real) do que a base que o build gera aqui.
          # Sem essa exclusão, qualquer deploy do site principal — mesmo
          # um ajuste que nada tem a ver com o Guia — sobrescreve o
          # arquivo do servidor com a base pobre e derruba EN/ES do
          # sitemap. Isso já aconteceu uma vez (ver auditoria de
          # 2026-08-09). O restante de out/ continua sendo enviado normal.
          exclude: |
            **/.git*
            **/.git*/**
            sitemap.xml
            sitemap-articles.xml
